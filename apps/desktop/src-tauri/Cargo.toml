[package]
name = "interline"
version = "0.1.0"
edition = "2021"
description = "Interline desktop shell: window, core supervisor, endpoint hand-off"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
