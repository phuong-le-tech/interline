spring.main.banner-mode=off
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null
# The API is loopback only; the OS picks the port and reports it in the READY line.
server.address=127.0.0.1
server.port=0
# Development fallbacks only. The shell always passes explicit directories.
interline.data-dir=${java.io.tmpdir}/interline-core-dev
interline.log-dir=${interline.data-dir}/logs
