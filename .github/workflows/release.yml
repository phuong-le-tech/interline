name: Release

# Pushing a tag v* builds, signs and uploads a DRAFT release. Nothing is published automatically:
# the maintainer reviews the draft and publishes it by hand. Secrets and the one-time setup: docs/RELEASE.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Job 1: runs repository build code (pnpm scripts, Cargo build scripts). It gets no credentials and no environment.
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Validate the tag and the placeholders
        env:
          CERT_SHA256: ${{ vars.INTERLINE_CERT_SHA256 }}
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1; }
          conf=$(python3 -I -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          [ "v$conf" = "$TAG" ] || { echo "tag $TAG does not match tauri.conf.json version $conf"; exit 1; }
          if grep -q 'REPLACE_WITH' apps/desktop/src-tauri/tauri.conf.json; then echo 'tauri.conf.json still has the placeholder updater public key (docs/RELEASE.md)'; exit 1; fi
          [ -n "$CERT_SHA256" ] || { echo 'repository variable INTERLINE_CERT_SHA256 is not set (docs/RELEASE.md)'; exit 1; }
      - name: Install dependencies
        run: cd apps/desktop && pnpm install --frozen-lockfile
      - name: Build the unsigned app
        run: scripts/package/build.sh
      - name: Pack the unsigned app and record its SHA-256
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/unsigned"
          COPYFILE_DISABLE=1 tar -C apps/desktop/src-tauri/target/release/bundle/macos -czf "$RUNNER_TEMP/unsigned/Interline-unsigned.tar.gz" Interline.app
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/unsigned/Interline-unsigned.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interline-unsigned
          path: ${{ runner.temp }}/unsigned/Interline-unsigned.tar.gz
          retention-days: 1

  # Job 2: the only job with secrets and the environment. It runs no dependency or build code of the repository: the artifact is DATA
  # (checked against the hash the build job recorded, extracted, signed, never executed). Only scripts that
  # are committed in the tagged revision run here.
  release:
    needs: build
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write # create the draft release
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: interline-unsigned
          path: ${{ runner.temp }}/in
      - name: Check the artifact against the recorded hash and unpack it
        env:
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: |
          actual=$(shasum -a 256 "$RUNNER_TEMP/in/Interline-unsigned.tar.gz" | cut -d ' ' -f 1)
          [ "$actual" = "$EXPECTED" ] || { echo "artifact hash $actual differs from the build job's $EXPECTED"; exit 1; }
          mkdir "$RUNNER_TEMP/app" && tar -xzf "$RUNNER_TEMP/in/Interline-unsigned.tar.gz" -C "$RUNNER_TEMP/app"
      - name: Sign inside-out, check the pinned certificate, then destroy the keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.INTERLINE_SIGNING_IDENTITY }}
          CERT_SHA256: ${{ vars.INTERLINE_CERT_SHA256 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/interline-release.keychain-db"
          cleanup() { security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -f "$RUNNER_TEMP/identity.p12"; }
          trap cleanup EXIT
          KC_PW=$(uuidgen)
          echo "::add-mask::$KC_PW"
          (umask 077; printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/identity.p12")
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/identity.p12" -x -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/identity.p12"
          app="$RUNNER_TEMP/app/Interline.app"
          SIGN_KEYCHAIN="$KEYCHAIN" scripts/package/sign-macos.sh "$app"
          mkdir "$RUNNER_TEMP/cert" && cd "$RUNNER_TEMP/cert" && codesign -d --extract-certificates "$app"
          found=$(openssl x509 -inform DER -noout -fingerprint -sha256 -in codesign0 | sed 's/.*=//' | tr -d ':')
          want=$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr 'a-f' 'A-F')
          [ "$found" = "$want" ] || { echo "signed with $found, expected $want"; exit 1; }
      - name: Package release assets
        env:
          CERT_SHA256: ${{ vars.INTERLINE_CERT_SHA256 }}
        run: |
          out="$RUNNER_TEMP/release"; mkdir "$out"
          version=${TAG#v}
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/app" -czf "$out/Interline.app.tar.gz" Interline.app
          dmg_root=$(mktemp -d); ditto "$RUNNER_TEMP/app/Interline.app" "$dmg_root/Interline.app"; ln -s /Applications "$dmg_root/Applications"
          hdiutil create -ov -format UDZO -volname Interline -srcfolder "$dmg_root" "$out/Interline_${version}_aarch64.dmg"
          scripts/package/render-install.sh "$CERT_SHA256" > "$out/install.sh"
      - name: Install the pinned updater signer without lifecycle scripts
        run: npm install --ignore-scripts --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/signer" @tauri-apps/cli@2.12.4
      - name: Sign the update archive (the only step that sees the updater key)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: '"$RUNNER_TEMP/signer/node_modules/.bin/tauri" signer sign "$RUNNER_TEMP/release/Interline.app.tar.gz"'
      - name: Manifest and checksums
        run: |
          out="$RUNNER_TEMP/release"; version=${TAG#v}
          scripts/package/make-latest-json.sh "$version" "$GITHUB_REPOSITORY" "$TAG" "$out/Interline.app.tar.gz.sig" > "$out/latest.json"
          (cd "$out" && shasum -a 256 Interline.app.tar.gz "Interline_${version}_aarch64.dmg" install.sh latest.json > SHA256SUMS)
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CERT_SHA256: ${{ vars.INTERLINE_CERT_SHA256 }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Interline $TAG" \
            --notes "Draft. Signing certificate SHA-256: $CERT_SHA256. Not notarized: see install.sh or the Open Anyway steps." \
            "$RUNNER_TEMP"/release/*
      - name: Delete the temporary keychain (backup)
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/interline-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/identity.p12"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Placeholder
        run: echo "Windows bundle job placeholder"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Placeholder
        run: echo "Linux bundle job placeholder"
