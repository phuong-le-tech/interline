name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # M1GoldenTest compares against a past commit
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify core
        working-directory: services/core
        run: ./mvnw -B verify
      - name: Upload core jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-jar
          path: services/core/app/target/interline-core.jar

  ui:
    needs: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Download core jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-jar
          path: services/core/app/target
      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/desktop
        run: pnpm lint
      - name: Type check
        working-directory: apps/desktop
        run: pnpm typecheck
      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium
      - name: E2E
        working-directory: apps/desktop
        run: pnpm test:e2e

  agent-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # M1GoldenTest compares against a past commit
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Resolve and build the Swift agent
        working-directory: agents/macos-capture
        run: |
          swift package resolve --force-resolved-versions
          swift build -c release --force-resolved-versions
      - name: Swift self-tests
        working-directory: agents/macos-capture
        run: swift run -c release CaptureSelfTest
      - name: Generate synthetic speech fixtures
        run: scripts/fixtures/gen-speech.sh
      - name: Cache the tiny model
        id: models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/models
          # sha256 of ggml-tiny.bin in services/core/app/src/main/resources/models/catalog.json
          key: whisper-tiny-be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21
      - name: Fetch the tiny model and Silero VAD (checksums verified)
        if: steps.models.outputs.cache-hit != 'true'
        run: python3 scripts/bench/fetch-models.py ~/models tiny silero-v6.2.0
      - name: Conformance and crash test against the Swift agent
        working-directory: services/core
        run: |
          tiny="$HOME/models/ggml-tiny.bin"
          vad="$HOME/models/ggml-silero-v6.2.0.bin"
          ./mvnw -B verify -Pswift-agent \
            "-Dinterline.conformance.model_path=$tiny" \
            "-Dinterline.conformance.vad_model_path=$vad" \
            "-Dinterline.swift-agent.test-args=[\"--model=$tiny\",\"--vad-model=$vad\",\"--language=en\"]" \
            -Dinterline.swift-agent.test-voice=Samantha
